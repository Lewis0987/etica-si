<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Home Page</title>
  <style>
    body {
      background-color: #8d1b80;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      color: white;
      font-family: sans-serif;
    }

    .custom-button {
      background-color: #efad11;
      color: #00196b;
      border: none;
      padding: 10px 40px;
      font-size: 16px;
      border-radius: 10px;
      cursor: pointer;
      width: 100%;
      max-width: 300px;
      transition: background-color 0.3s;
      margin-top: 20px;
    }

    .custom-button:hover {
      background-color: #d9a940;
    }

    #pageLoad, #clickEvent {
      font-size: 32px;
      font-weight: bold;
      margin-top: 20px;
    }
  </style>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.8.3/jquery.min.js"></script>
</head>
<body>

  <h1>Home Page</h1>
  <label for="home">Home:</label>

  <button class="custom-button" onclick="register()">Register</button>

  <div>
    <p>This number will animate on document ready:</p>
    <div id="pageLoad">0</div>
  </div>

  <div>
    <p>This number will animate on click:</p>
    <div id="clickEvent">4321</div>
  </div>

  <script>
    function register() {
      alert("註冊成功！");
    }

    // 動畫：頁面載入時動畫遞增
    $(document).ready(function () {
      $({ Counter: 0 }).animate({ Counter: 1234 }, {
        duration: 5000,
        easing: 'swing',
        step: function (now) {
          $('#pageLoad').text(Math.ceil(now));
        }
      });
    });

    // 動畫：點擊數字才開始動畫
    $('#clickEvent').click(function () {
      $({ Counter: 0 }).animate({ Counter: 4321 }, {
        duration: 500,
        easing: 'swing',
        step: function (now) {
          $('#clickEvent').text(Math.ceil(now));
        }
      });
    });
  </script>


</body>
</html>
